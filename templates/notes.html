<!DOCTYPE html>
<html>
<head>
    <title>Available Notes - NoteNest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        📖 Available Notes
    </h1>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead class="table-dark">

                    <tr>
                        <th>Title</th>
                        <th>Subject</th>
                        <th>Uploaded By</th>
                        <th>Download</th>
                    </tr>

                </thead>

                <tbody>

                    {% for note in notes %}
                    <tr>

                        <td>{{ note[0] }}</td>

                        <td>{{ note[1] }}</td>

                        <td>{{ note[3] }}</td>

                        <td>
                            <a href="/download/{{ note[2] }}"
                               class="btn btn-primary btn-sm">
                                Download
                            </a>
                        </td>

                    </tr>
                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/dashboard"
           class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
